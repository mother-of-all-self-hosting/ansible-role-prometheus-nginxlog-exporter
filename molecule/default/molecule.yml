---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: prometheus-nginxlog-exporter-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        prometheus_nginxlog_exporter_debug_service_enabled: false

        # Variables for prometheus-nginxlog-exporter
        prometheus_nginxlog_exporter_uid: 1000
        prometheus_nginxlog_exporter_gid: 1000
        prometheus_nginxlog_exporter_scheme: http
        prometheus_nginxlog_exporter_hostname: localhost
        prometheus_nginxlog_exporter_container_labels_metrics_enabled: false
        prometheus_nginxlog_exporter_container_http_host_bind_port: 4040
        prometheus_nginxlog_exporter_architecture: amd64
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
